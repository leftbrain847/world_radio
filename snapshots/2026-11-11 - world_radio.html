<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026-11-11 - world_radio</title>
<style>
:root{--bg:#0d0f12;--panel:#161a20;--line:#262c35;--ink:#e8ecf1;--dim:#8a94a3;--acc:#f2b33d;--ok:#4cc38a;--bad:#e5615a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{max-width:560px;margin:0 auto;padding:14px 14px 140px}
h1{font-size:20px;letter-spacing:.5px;margin:4px 0 2px}
h1 b{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer}
button[aria-pressed=true],button.on{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{padding:6px 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.st.playing{border-color:var(--acc)}
.st .meta{flex:1;min-width:0}
.st .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st .tg{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st button{padding:6px 9px}
.msg{color:var(--dim);padding:14px 4px;text-align:center}
.msg.err{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:700;text-align:center;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid button.right{border-color:var(--ok);color:var(--ok)}
.grid button.wrong{border-color:var(--bad);color:var(--bad)}
.actions{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
#spin{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.row{display:flex;justify-content:space-between;color:var(--dim);font-size:13px}
#player{position:fixed;left:0;right:0;bottom:0;background:#11151b;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#player .in{max-width:560px;margin:0 auto}
#np{display:flex;align-items:center;gap:8px}
#np .meta{flex:1;min-width:0}
#npName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npInfo{color:var(--dim);font-size:12px}
.hide{display:none!important}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;width:14px}
.eq i{width:3px;background:var(--acc);animation:eq 900ms infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-300ms}.eq i:nth-child(3){animation-delay:-600ms}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}
</style>
</head>
<body>
<h1>world<b>_</b>radio</h1>
<p class="sub">Radio en vivo en español — elige un país y escucha cómo se habla allí.</p>
<nav>
  <button id="tabListen" aria-pressed="true">Escuchar</button>
  <button id="tabRoulette" aria-pressed="false">Ruleta de acentos</button>
  <button id="tabFavs" aria-pressed="false">Favoritas</button>
</nav>
<section id="viewListen">
  <div class="chips" id="countries"></div>
  <div class="list" id="stations"><p class="msg">Elige un país.</p></div>
</section>
<section id="viewRoulette" class="hide">
  <div class="panel">
    <div class="row"><span>Racha <b id="streak">0</b></span><span>Mejor <b id="best">0</b></span></div>
    <div class="big" id="rqTitle">¿De dónde es esta radio?</div>
    <p class="msg" id="rqMsg">Toca «Girar» para escuchar una emisora al azar.</p>
    <div class="grid" id="choices"></div>
    <div class="grid actions"><button id="spin">Girar</button><button id="reveal" disabled>Revelar</button></div>
  </div>
</section>
<section id="viewFavs" class="hide">
  <div class="list" id="favs"></div>
</section>
<div id="player" class="hide"><div class="in">
  <div id="np">
    <span class="eq hide" id="eq"><i></i><i></i><i></i></span>
    <div class="meta"><div id="npName">—</div><div id="npInfo"></div></div>
    <button id="favBtn" aria-pressed="false">☆</button>
    <button id="playBtn">❚❚</button>
  </div>
</div></div>
<audio id="audio" preload="none"></audio>
<script>
// world_radio core: pure logic, no DOM. Tested in Node, inlined into the page by scripts/build.mjs.

const CONFIG = {
  // Radio Browser mirrors, tried in order. Its docs ask apps to use a named server, not the bare domain.
  servers: ['https://de1.api.radio-browser.info', 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info'],
  language: 'spanish',
  stationsPerCountry: 60,
  rouletteTopN: 25,
  rouletteChoices: 4,
  requestTimeoutMs: 8000,
  storageKeys: { favorites: 'world_radio.favorites', streak: 'world_radio.streak', best: 'world_radio.best' },
  countries: [
    { code: 'MX', name: 'México', speech: 'es-MX' },
    { code: 'PE', name: 'Perú', speech: 'es-PE' },
    { code: 'EC', name: 'Ecuador', speech: 'es-EC' },
    { code: 'CO', name: 'Colombia', speech: 'es-CO' },
    { code: 'AR', name: 'Argentina', speech: 'es-AR' },
    { code: 'CL', name: 'Chile', speech: 'es-CL' },
    { code: 'ES', name: 'España', speech: 'es-ES' },
    { code: 'CU', name: 'Cuba', speech: 'es-CU' },
    { code: 'VE', name: 'Venezuela', speech: 'es-VE' },
    { code: 'GT', name: 'Guatemala', speech: 'es-GT' },
    { code: 'DO', name: 'Rep. Dominicana', speech: 'es-DO' },
    { code: 'PR', name: 'Puerto Rico', speech: 'es-PR' },
  ],
};

function countryByCode(code, cfg = CONFIG) {
  return cfg.countries.find((c) => c.code === code) ?? null;
}

function searchUrl(server, countryCode, cfg = CONFIG) {
  const q = new URLSearchParams({
    countrycode: countryCode,
    language: cfg.language,
    hidebroken: 'true',
    is_https: 'true',
    order: 'votes',
    reverse: 'true',
    limit: String(cfg.stationsPerCountry * 2), // headroom for the https / dedupe filter
  });
  return `${server}/json/stations/search?${q}`;
}

function clickUrl(server, uuid) {
  return `${server}/json/url/${encodeURIComponent(uuid)}`;
}

const clean = (s, max = 80) => String(s ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);

function isHttpsUrl(u) {
  try {
    return new URL(u).protocol === 'https:';
  } catch {
    return false;
  }
}

// Raw API rows -> playable stations: https streams only, no duplicates, best-voted first.
function normalizeStations(rows, countryCode, cfg = CONFIG) {
  const seen = new Set();
  const out = [];
  for (const r of Array.isArray(rows) ? rows : []) {
    const stream = r?.url_resolved || r?.url;
    if (!isHttpsUrl(stream)) continue;
    const name = clean(r.name);
    if (!name || !r.stationuuid) continue;
    const key = `${name.toLowerCase()}|${stream}`;
    const nameKey = name.toLowerCase();
    if (seen.has(key) || seen.has(nameKey)) continue;
    seen.add(key);
    seen.add(nameKey);
    out.push({
      id: String(r.stationuuid),
      name,
      stream,
      country: countryCode,
      city: clean(r.state, 40),
      tags: clean(r.tags, 120).split(',').map((t) => t.trim()).filter(Boolean).slice(0, 3),
      codec: clean(r.codec, 12),
      bitrate: Number.isFinite(+r.bitrate) ? +r.bitrate : 0,
      votes: Number.isFinite(+r.votes) ? +r.votes : 0,
      homepage: isHttpsUrl(r.homepage) ? r.homepage : '',
    });
  }
  out.sort((a, b) => b.votes - a.votes || a.name.localeCompare(b.name));
  return out.slice(0, cfg.stationsPerCountry);
}

// Small seeded PRNG so roulette rounds are testable.
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// One accent-roulette round: a hidden station plus country choices that include the answer.
function makeRound(stationsByCountry, rand, cfg = CONFIG) {
  const pool = Object.entries(stationsByCountry).filter(([, list]) => list.length);
  if (!pool.length) return null;
  const [answer, list] = pool[Math.floor(rand() * pool.length)];
  const top = list.slice(0, cfg.rouletteTopN);
  const station = top[Math.floor(rand() * top.length)];
  const others = shuffle(cfg.countries.map((c) => c.code).filter((c) => c !== answer), rand).slice(0, cfg.rouletteChoices - 1);
  return { station, answer, choices: shuffle([answer, ...others], rand) };
}

function scoreGuess(round, guess, streak) {
  const correct = guess === round.answer;
  return { correct, streak: correct ? streak + 1 : 0 };
}

function toggleFavorite(favs, station) {
  const has = favs.some((f) => f.id === station.id);
  return has ? favs.filter((f) => f.id !== station.id) : [...favs, { id: station.id, name: station.name, stream: station.stream, country: station.country }];
}

// world_radio UI. Uses the core functions inlined above it. All station text goes into the page as text, never HTML.
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'text') n.textContent = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
      else n.setAttribute(k, v);
    }
    for (const c of kids) n.append(c);
    return n;
  };
  const store = {
    get(key, dflt) { try { const v = localStorage.getItem(key); return v == null ? dflt : JSON.parse(v); } catch { return dflt; } },
    set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* storage off: fine */ } },
  };
  const K = CONFIG.storageKeys;

  const state = {
    country: null,
    cache: {},              // countryCode -> stations
    server: null,           // the mirror that answered last
    current: null,          // station playing
    favs: store.get(K.favorites, []),
    streak: store.get(K.streak, 0),
    best: store.get(K.best, 0),
    round: null,
    rand: rng(Date.now() & 0xffffffff),
  };
  const audio = $('audio');

  // ---------- data ----------
  async function getJson(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), CONFIG.requestTimeoutMs);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  async function loadCountry(code) {
    if (state.cache[code]) return state.cache[code];
    const servers = state.server ? [state.server, ...CONFIG.servers.filter((s) => s !== state.server)] : CONFIG.servers;
    let lastErr;
    for (const server of servers) {
      try {
        const rows = await getJson(searchUrl(server, code));
        state.server = server;
        return (state.cache[code] = normalizeStations(rows, code));
      } catch (e) { lastErr = e; }
    }
    throw lastErr ?? new Error('sin conexión');
  }

  // ---------- views ----------
  const tabs = { Listen: 'viewListen', Roulette: 'viewRoulette', Favs: 'viewFavs' };
  function show(name) {
    for (const [t, v] of Object.entries(tabs)) {
      $(`tab${t}`).setAttribute('aria-pressed', String(t === name));
      $(v).classList.toggle('hide', t !== name);
    }
    if (name === 'Favs') renderFavs();
  }
  for (const t of Object.keys(tabs)) $(`tab${t}`).addEventListener('click', () => show(t));

  function renderCountries() {
    const box = $('countries');
    box.replaceChildren(...CONFIG.countries.map((c) => el('button', {
      text: c.name, 'aria-pressed': String(state.country === c.code), 'data-code': c.code,
      on: { click: () => pickCountry(c.code) },
    })));
  }

  async function pickCountry(code) {
    state.country = code;
    renderCountries();
    const list = $('stations');
    list.replaceChildren(el('p', { class: 'msg', text: 'Buscando emisoras…' }));
    try {
      const stations = await loadCountry(code);
      if (state.country !== code) return;
      if (!stations.length) return list.replaceChildren(el('p', { class: 'msg', text: 'No hay emisoras https para este país ahora mismo.' }));
      list.replaceChildren(el('p', { class: 'msg', text: `${stations.length} emisoras https · las más votadas primero` }), ...stations.map(stationRow));
    } catch {
      list.replaceChildren(el('p', { class: 'msg err', text: 'No se pudo cargar el directorio de radios. Revisa tu conexión e inténtalo otra vez.' }));
    }
  }

  function stationRow(s) {
    const isFav = state.favs.some((f) => f.id === s.id);
    const info = [s.city, s.tags.join(' · '), s.bitrate ? `${s.bitrate} kbps` : ''].filter(Boolean).join(' — ');
    return el('div', { class: `st${state.current?.id === s.id ? ' playing' : ''}`, 'data-id': s.id }, [
      el('div', { class: 'meta' }, [el('div', { class: 'nm', text: s.name }), el('div', { class: 'tg', text: info || (countryByCode(s.country)?.name ?? '') })]),
      el('button', { text: isFav ? '★' : '☆', 'aria-label': 'Favorita', on: { click: (e) => { favorite(s); e.target.textContent = state.favs.some((f) => f.id === s.id) ? '★' : '☆'; } } }),
      el('button', { text: '▶', 'aria-label': 'Escuchar', on: { click: () => play(s, false) } }),
    ]);
  }

  function renderFavs() {
    const box = $('favs');
    if (!state.favs.length) return box.replaceChildren(el('p', { class: 'msg', text: 'Aún no tienes favoritas. Toca ☆ en una emisora.' }));
    box.replaceChildren(...state.favs.map((f) => stationRow({ ...f, city: '', tags: [], bitrate: 0 })));
  }

  function favorite(s) {
    state.favs = toggleFavorite(state.favs, s);
    store.set(K.favorites, state.favs);
    syncPlayer();
  }

  // ---------- player ----------
  function play(s, hidden) {
    state.current = { ...s, hidden };
    audio.src = s.stream;
    audio.play().catch(() => { $('npInfo').textContent = 'Toca ▶ para empezar.'; });
    if (state.server) fetch(clickUrl(state.server, s.id)).catch(() => {}); // Radio Browser's play counter
    $('player').classList.remove('hide');
    syncPlayer();
    document.querySelectorAll('.st').forEach((n) => n.classList.toggle('playing', n.dataset.id === s.id));
  }

  function syncPlayer() {
    const s = state.current;
    if (!s) return;
    $('npName').textContent = s.hidden ? '¿? Emisora misteriosa' : s.name;
    $('npInfo').textContent = s.hidden ? 'Escucha el acento…' : (countryByCode(s.country)?.name ?? '');
    $('favBtn').classList.toggle('hide', !!s.hidden);
    $('favBtn').textContent = state.favs.some((f) => f.id === s.id) ? '★' : '☆';
  }

  $('playBtn').addEventListener('click', () => {
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  });
  $('favBtn').addEventListener('click', () => state.current && favorite(state.current));
  audio.addEventListener('playing', () => { $('playBtn').textContent = '❚❚'; $('eq').classList.remove('hide'); });
  audio.addEventListener('pause', () => { $('playBtn').textContent = '▶'; $('eq').classList.add('hide'); });
  audio.addEventListener('waiting', () => { $('npInfo').textContent = 'Conectando…'; });
  audio.addEventListener('error', () => {
    $('npInfo').textContent = 'Esta emisora no responde. Prueba otra.';
    $('eq').classList.add('hide');
  });

  // ---------- accent roulette ----------
  function paintStreak() { $('streak').textContent = state.streak; $('best').textContent = state.best; }

  async function spin() {
    $('spin').disabled = true;
    $('rqMsg').textContent = 'Girando…';
    $('choices').replaceChildren();
    try {
      // Load a handful of countries so the answer isn't always the one you browsed.
      const picks = shuffleCodes().slice(0, 4);
      const results = await Promise.allSettled(picks.map(loadCountry));
      const by = {};
      picks.forEach((c, i) => { if (results[i].status === 'fulfilled') by[c] = results[i].value; });
      const round = makeRound(by, state.rand);
      if (!round) throw new Error('empty');
      state.round = round;
      $('rqTitle').textContent = '¿De dónde es esta radio?';
      $('rqMsg').textContent = 'Escucha y elige un país.';
      $('choices').replaceChildren(...round.choices.map((code) => el('button', {
        text: countryByCode(code).name, 'data-code': code, on: { click: (e) => guess(code, e.target) },
      })));
      $('reveal').disabled = false;
      play(round.station, true);
    } catch {
      $('rqMsg').textContent = 'No se pudo cargar una emisora. Inténtalo otra vez.';
    } finally { $('spin').disabled = false; }
  }

  function shuffleCodes() {
    const codes = CONFIG.countries.map((c) => c.code);
    for (let i = codes.length - 1; i > 0; i--) { const j = Math.floor(state.rand() * (i + 1)); [codes[i], codes[j]] = [codes[j], codes[i]]; }
    return codes;
  }

  function guess(code, btn) {
    const r = state.round;
    if (!r || r.done) return;
    r.done = true;
    const res = scoreGuess(r, code, state.streak);
    state.streak = res.streak;
    state.best = Math.max(state.best, state.streak);
    store.set(K.streak, state.streak); store.set(K.best, state.best);
    paintStreak();
    btn.classList.add(res.correct ? 'right' : 'wrong');
    $('choices').querySelector(`[data-code="${r.answer}"]`)?.classList.add('right');
    reveal(res.correct ? '¡Correcto!' : 'Casi…');
  }

  function reveal(head = 'Era…') {
    const r = state.round;
    if (!r) return;
    r.done = true;
    $('rqTitle').textContent = `${head} ${countryByCode(r.answer).name}`;
    $('rqMsg').textContent = r.station.name;
    $('reveal').disabled = true;
    if (state.current?.id === r.station.id) { state.current.hidden = false; syncPlayer(); }
  }
  $('spin').addEventListener('click', spin);
  $('reveal').addEventListener('click', () => { if (state.round && !state.round.done) { state.streak = 0; store.set(K.streak, 0); paintStreak(); } reveal(); });

  // ---------- boot ----------
  renderCountries();
  paintStreak();
})();

</script>
</body>
</html>
